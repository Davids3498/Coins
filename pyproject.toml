[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coin_clf"
version = "0.1.0"
description = "Shared model/data/serving code for the Roman coin classifier"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "pillow",
    "numpy",
    "pandas",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# "." alongside "src" is deliberate. The nine root-level test_*.py modules import root modules
# (promote, splits, drift_report, monitor_state, replay_traffic, app.main) and are NOT moved into
# tests/ -- moving them would break those imports. Pinning both entries here makes that work by
# configuration rather than by pytest's incidental rootdir insertion.
pythonpath = ["src", "."]

# Collection is pinned, not discovered. data/ is 51 GB, .dvc/ is a 44 GB cache and weights/ is
# 6 GB -- walking them costs minutes and finds nothing. notebooks/ holds archived experiment
# records that are not maintained code.
norecursedirs = [".*", "data", "outputs", "weights", "notebooks", "mlflow"]

# --strict-markers: an unregistered marker is an error, not a silent no-op. A typo'd
# @pytest.mark.needs_dat would otherwise mark nothing and quietly run on a runner with no dataset,
# which is precisely the failure CI exists to catch.
addopts = "--strict-markers"

# Nothing carries these yet -- every test in the suite today runs with no dataset and no GPU.
# They are declared so the CI filter (-m "not needs_data and not needs_gpu") is a standing
# contract: the next test that does need the real tree gets marked instead of getting deleted.
markers = [
    "needs_data: requires the real 57k-image tree on disk",
    "needs_gpu: requires CUDA",
]

[tool.ruff]
# notebooks/ is an archive of experiment records -- the runs that produced v1..v7 and the
# distillation path, kept so a published number can be traced back to the code that produced it.
# They are history, not maintained code, and 153 of the 169 findings on this tree came from
# there (semicolons, unused imports in exploratory cells). Linting them would make
# `ruff check .` permanently red on files nobody may edit, which teaches everyone to ignore the
# gate -- the one outcome that costs more than the lint debt.
#
# This is an exclusion for ARCHIVED work, not for notebooks generally. A notebook that becomes
# part of the pipeline should move out of notebooks/ and be linted like everything else.
exclude = ["notebooks"]

[tool.ruff.lint]
# E741 ("ambiguous variable name `l`") is ignored as a DELIBERATE call, not an oversight.
#
# All 11 occurrences are the same idiom -- `[l for l in path.read_text().splitlines() if l.strip()]`
# -- and they sit in coin_clf/data.py, verify_data_integrity.py, monitor_state.py and splits.py:
# the exact files that read the clean list, the manifest and the active-train list. That code is
# where all three leakage incidents originated, so every diff touching it costs a careful review
# and a re-run of verify_data_integrity.py over 57,792 files. Spending that on renaming a loop
# variable buys nothing: `l` is ambiguous with `1` in some fonts, which is a readability argument,
# and these are one-line comprehensions where the binding never leaves the line.
#
# What would reverse this: the rule catching a real ambiguity in NEW code. Prefer a descriptive
# name when writing anything here; this only stops the gate from being red about existing lines.
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
# Third-party stubs are not installed in CI (torch/mlflow/evidently ship none, or partial ones).
# This keeps the gate about THIS code rather than about the ecosystem's stub coverage.
ignore_missing_imports = true

# Scoped to src/coin_clf for now -- the shared library every other component imports, so it is
# where a type error propagates furthest. The root scripts currently report 11 errors across 8
# files (4 arg-type, 3 var-annotated, 2 import-untyped, 1 union-attr, 1 override); widening the
# gate to cover them is a follow-up, not a blocker for turning CI on.
files = ["src/coin_clf"]
